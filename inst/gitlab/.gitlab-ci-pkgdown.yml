image: rocker/tidyverse

before_script:
  - apt-get update
  - R -e 'install.packages(c("pkgdown", "pak"))'
  - R -e 'pak::local_install_deps()'

create-pages:
  script:
    - R -e 'pkgdown::build_site()'
  artifacts:
    paths:
      - public
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
